<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tutorial: fiore</title>
    <meta name="description" content="Learn fiore step by step in your browser: elements, builders, events and signals, with a live editor." />
    <link rel="canonical" href="https://vrtexe.github.io/fiore/tutorial/" />
    <meta name="theme-color" content="#0a0c0f" />
    <link rel="icon" href="../assets/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/brand/site.webmanifest" />
    <script>try{if(localStorage.getItem('fiore-syntax')==='jsx')document.documentElement.dataset.syntax='jsx'}catch{}</script>
    <link rel="stylesheet" href="../assets/site.css" />
    <link rel="stylesheet" href="tutorial.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body class="tutorial">
    <a class="skip-link" href="#lesson">Skip to the lesson</a>

    <header class="nav">
      <div class="wrap nav-inner">
        <a class="brand" href="../index.html" aria-label="fiore home">
          <img class="brand-mark" src="../assets/brand/fiore-symbol-green.svg" alt="" width="28" height="28" />
          fiore
        </a>
        <nav class="nav-links" aria-label="Main">
          <a href="../index.html">Home</a>
          <a class="is-current" href="../tutorial/" aria-current="page">Tutorial</a>
          <a href="../guide/quick-start.html">Docs</a>
          <a href="../api.html">API</a>
          <a href="../signals.html">Signals</a>
          <a href="https://github.com/vrtexe/fiore">GitHub</a>
        </nav>
        <a class="btn" href="../guide/quick-start.html">Quick start</a>
      </div>
    </header>

    <div class="tut">
      <section class="tut-lesson" id="lesson" aria-live="polite">
        <div class="tut-picker">
          <label for="tut-select">Lesson</label>
          <select id="tut-select"></select>
        </div>
        <article class="tut-body docs-main" data-body></article>
        <div class="tut-steps">
          <button type="button" class="tut-btn" data-prev>Previous</button>
          <button type="button" class="tut-btn tut-solve" data-solve>Solve</button>
          <button type="button" class="tut-btn tut-next" data-next>Next</button>
        </div>
      </section>

      <div class="tut-split tut-split-x" role="separator" aria-orientation="vertical" aria-label="Resize the lesson and the editor" tabindex="0" data-split="x"></div>

      <section class="tut-work" aria-label="Editor and preview">
        <div class="tut-bar">
          <span data-file>main.js</span>
          <span class="tut-tools">
            <span data-switch></span>
            <button type="button" class="tut-link" data-reset>Reset</button>
          </span>
        </div>
        <div class="tut-editor" data-editor></div>
        <div class="tut-split tut-split-y" role="separator" aria-orientation="horizontal" aria-label="Resize the editor and the preview" tabindex="0" data-split="y"></div>
        <div class="tut-bar">
          <span>Preview</span>
          <span class="tut-status" data-status></span>
        </div>
        <iframe class="tut-preview" title="Preview" sandbox="allow-scripts allow-modals" data-preview></iframe>
        <pre class="tut-console" data-console aria-label="Console"></pre>
      </section>
    </div>
  </body>
</html>
