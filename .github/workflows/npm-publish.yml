# Stages a release on npm with trusted publishing (OIDC), so no npm token is stored in this
# repository. Set up the trust once, allowing staged publishing only (never --allow-publish):
#   npm trust github @fiorejs/jsx --file npm-publish.yml --repository vrtexe/fiore-jsx --environment npm --allow-stage-publish
# Restrict the GitHub environment "npm" to release tags. A maintainer then approves the staged version
# with 2FA on npmjs.com or with `npm stage approve <stage-id>`. The tests run in their own job without
# the OIDC permission, before the version commit is pushed.

name: publish

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Release version $APP_VERSION"
          git push origin HEAD:main
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}

  publish:
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}
      - run: npm stage publish
