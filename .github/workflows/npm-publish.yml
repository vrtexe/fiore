# Stages a release on npm with trusted publishing (OIDC), so no npm token is stored in this
# repository. npmjs.com must have the trusted publisher configured for vrtexe/fiore-signals with workflow
# npm-publish.yml and environment npm. The workflow can only stage a version ("npm stage publish",
# allowed by default for trusted publishers); a maintainer then approves it with 2FA on npmjs.com
# or with `npm stage approve <stage-id>`.

name: publish

on:
  release:
    types: [published]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release version $APP_VERSION" || true
          git push origin HEAD:main
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}

  publish:
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}
      - run: npm ci
      - run: npm test
      - run: npm stage publish
